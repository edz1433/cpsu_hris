<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CPSU HRIS | Offline</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               font-family: "Source Sans Pro", Segoe UI, Arial, sans-serif; background: #f4f6f5; color: #1f2d24; }
        .box { text-align: center; padding: 32px 24px; max-width: 420px; }
        img { width: 96px; height: 96px; }
        h1 { font-size: 22px; margin: 16px 0 8px; color: #146a3b; }
        p { margin: 0 0 20px; color: #4b5a51; }
        button { background: #146a3b; color: #fff; border: 0; border-radius: 6px; padding: 10px 22px;
                 font-size: 15px; cursor: pointer; }
        button:hover { background: #0b3d24; }
    </style>
</head>
<body>
    <div class="box">
        <img src="icons/icon-192.png" alt="CPSU">
        <h1>Can't reach the HRIS server</h1>
        <p>Check your network connection and try again.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
